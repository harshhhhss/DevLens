<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />

    <title>DevLens - AI Code Review</title>
    <meta
      name="description"
      content="DevLens reviews your code with AI: bugs, security vulnerabilities, performance issues, refactor suggestions, a maintainability score and a rewritten clean version."
    />
    <meta name="author" content="Harsh Singh" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social previews. og:url and the absolute og:image URL
         should be set once the production domain is known; relative paths are
         resolved by most crawlers in the meantime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevLens" />
    <meta property="og:title" content="DevLens - AI Code Review" />
    <meta
      property="og:description"
      content="Paste code and get bugs, security findings, performance notes and a rewritten clean version."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevLens - AI code review, structured." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevLens - AI Code Review" />
    <meta
      name="twitter:description"
      content="Paste code and get bugs, security findings, performance notes and a rewritten clean version."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
